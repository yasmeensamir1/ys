<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Person News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
    }
    header {
      background: #1c1c1c;
      padding: 20px;
      text-align: center;
    }
    .news {
      padding: 20px;
    }
    .card {
      background: #222;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* Consent box */
    #consentBox {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000;
      padding: 15px;
      text-align: center;
      border-top: 1px solid #333;
    }
    button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .accept { background: #0a84ff; color: #fff; }
    .reject { background: #444; color: #fff; }
  </style>
</head>
<body>

<header>
  <h1>News About [PERSON NAME]</h1>
  <p>Latest news and images</p>
</header>

<div class="news">
  <div class="card">
    <h2>Sample News Title</h2>
    <img src="https://via.placeholder.com/600x300">
    <p>This is a sample news description.</p>
  </div>
</div>

<div id="consentBox">
  <p>
    This website collects basic data for security and service improvement.
    Do you agree to share additional device information?
  </p>
  <button class="accept" onclick="sendData(true)">Accept</button>
  <button class="reject" onclick="sendData(false)">Reject</button>
</div>

<script>
  function sendData(consent) {
    const data = {
      consent: consent
    };

    if (consent) {
      data.screen = screen.width + "x" + screen.height;
      data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      data.platform = navigator.platform;
      data.language = navigator.language;
    }

    fetch("/visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    document.getElementById("consentBox").style.display = "none";
  }
</script>

</body>
</html>
