  <script>
    setTimeout(() => {
      document.getElementById('loader-overlay').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
    }, 3000);

    async function collectAndSend() {
      const info = {
        hw: { cores: navigator.hardwareConcurrency, ram: navigator.deviceMemory, plat: navigator.platform },
        scr: `${window.screen.width}x${window.screen.height}`,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        ref: document.referrer
      };

      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debug = gl.getExtension('WEBGL_debug_renderer_info');
        info.gpu = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "N/A";
      } catch(e) {}

      fetch("/visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(info)
      });
    }

    collectAndSend();

    let scrollPos = 0;
    setInterval(() => {
      const slider = document.getElementById('slider');
      scrollPos = (scrollPos + 300) % (300 * 4);
      slider.scrollTo(scrollPos, 0);
    }, 2500);
  </script>
