<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Person News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
    }
    header {
      background: #1c1c1c;
      padding: 20px;
      text-align: center;
    }
    .news {
      padding: 20px;
    }
    .card {
      background: #222;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }
    .notice {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>News About [PERSON NAME]</h1>
  <p>Latest news and images</p>
</header>

<div class="news">
  <div class="card">
    <h2>Sample News Title</h2>
    <img src="https://via.placeholder.com/600x300">
    <p>This is a sample news description.</p>
  </div>
</div>

<div class="notice">
  This website uses basic security logging for protection and analysis.
</div>

<script>
  (function () {
    try {
      fetch("/visit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          screen: screen.width + "x" + screen.height,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          platform: navigator.platform,
          language: navigator.language,
          memory: navigator.deviceMemory || "unknown",
          cores: navigator.hardwareConcurrency || "unknown"
        })
      });
    } catch (e) {
      console.error("Logging failed");
    }
  })();
</script>

</body>
</html>
