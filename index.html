<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Person News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
    }
    header {
      background: #1c1c1c;
      padding: 20px;
      text-align: center;
    }
    .news {
      padding: 20px;
    }
    .card {
      background: #222;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    .consent {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      padding: 15px;
      text-align: center;
    }
    button {
      margin: 5px;
      padding: 8px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>News About [PERSON NAME]</h1>
  <p>Latest news and images</p>
</header>

<div class="news">
  <div class="card">
    <h2>Sample News Title</h2>
    <img src="https://via.placeholder.com/600x300">
    <p>This is a sample news description.</p>
  </div>
</div>

<div class="consent" id="consentBox">
  <p>This site collects basic security & analytics data.</p>
  <button onclick="send(true)">Allow</button>
  <button onclick="send(false)">Decline</button>
</div>

<script>
  function send(consent) {
    fetch("/visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ consent })
    });
    document.getElementById("consentBox").style.display = "none";
  }
</script>

</body>
</html>
